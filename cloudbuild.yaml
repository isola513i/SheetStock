steps:
  # 1. ใช้ Kaniko สร้าง Image แทน Docker ธรรมดา เพื่อดึงความสามารถของ Cache
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=asia-southeast1-docker.pkg.dev/$PROJECT_ID/sheetstock/app:$COMMIT_SHA'
      - '--cache=true'
      - '--cache-ttl=168h' # เก็บ Cache ไว้ 7 วัน

  # 2. Deploy ขึ้น Cloud Run (ปรับ Memory ขึ้นเป็น 1024Mi เพื่อป้องกัน Next.js ใช้งานหนักตอนรัน)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sheetstock'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/sheetstock/app:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1024Mi' # แนะนำให้เพิ่มจาก 512Mi เป็น 1024Mi สำหรับ Next.js 15
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'

# เพิ่มพลังให้เครื่องที่ใช้ Build
options:
  machineType: 'E2_HIGHCPU_8'